spring:
  jackson:
    datatype:
      datetime:
        adjust-dates-to-context-time-zone: false
  application:
    name: tickethub-server
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_PORT:9092}}
    admin:
      fail-fast: true
    template:
      default-topic: ${tickethub.kafka.topic.name}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[delivery.timeout.ms]": 30000
        "[request.timeout.ms]": 10000
        "[max.block.ms]": 10000
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:tickethub}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DATABASE:tickethub}
    username: ${MONGO_USERNAME:tickethub}
    password: ${MONGO_PASSWORD:tickethub-local}
    authentication-database: ${MONGO_AUTH_DATABASE:admin}

tickethub:
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: db/changelog/db.changelog-master.xml
  mongo:
    connect-timeout: ${MONGO_CONNECT_TIMEOUT:5s}
    read-timeout: ${MONGO_READ_TIMEOUT:5s}
    server-selection-timeout: ${MONGO_SERVER_SELECTION_TIMEOUT:5s}
  kafka:
    topic:
      name: ${KAFKA_TOPIC:tickethub.events}
      partitions: ${KAFKA_TOPIC_PARTITIONS:3}
      replicas: ${KAFKA_TOPIC_REPLICAS:1}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
