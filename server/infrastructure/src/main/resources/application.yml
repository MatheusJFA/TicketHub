spring:
  jackson:
    datatype:
      datetime:
        adjust-dates-to-context-time-zone: false
  application:
    name: tickethub-server
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_PORT:9092}}
    admin:
      fail-fast: true
    template:
      default-topic: ${tickethub.kafka.topic.name}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[delivery.timeout.ms]": 30000
        "[request.timeout.ms]": 10000
        "[max.block.ms]": 10000
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:tickethub}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DATABASE:tickethub}
    username: ${MONGO_USERNAME:tickethub}
    password: ${MONGO_PASSWORD:tickethub-local}
    authentication-database: ${MONGO_AUTH_DATABASE:admin}

tickethub:
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: db/changelog/db.changelog-master.xml
  spots:
    async-threshold: ${SPOTS_ASYNC_THRESHOLD:1000}
    seat-number-width: ${SPOTS_SEAT_NUMBER_WIDTH:5}
  audit:
    enabled: ${AUDIT_ENABLED:true}
  auth:
    refresh-ttl: ${TICKETHUB_AUTH_REFRESH_TTL:7d}
    login-rate-limit-per-minute: ${TICKETHUB_AUTH_LOGIN_RATE_LIMIT_PER_MINUTE:10}
  zipcode:
    enabled: ${TICKETHUB_ZIPCODE_ENABLED:true}
    base-url: ${TICKETHUB_ZIPCODE_BASE_URL:https://viacep.com.br}
    connect-timeout: ${TICKETHUB_ZIPCODE_CONNECT_TIMEOUT:5s}
    read-timeout: ${TICKETHUB_ZIPCODE_READ_TIMEOUT:5s}
  security:
    jwt:
      secret: ${TICKETHUB_JWT_SECRET:dev-only-change-me-in-production-0123456789abcdef}
      expiration-minutes: ${TICKETHUB_JWT_EXPIRATION_MINUTES:60}
    users:
      - username: ${TICKETHUB_ADMIN_USERNAME:admin}
        password: "${TICKETHUB_ADMIN_PASSWORD_HASH:$2a$10$yK7PogeVNyS8.guDq1yKneeynLO7jVthcXy5ZQonI6gid0M4kGhKS}"
        roles: [ADMIN]
      - username: ${TICKETHUB_PARTNER_USERNAME:partner}
        password: "${TICKETHUB_PARTNER_PASSWORD_HASH:$2a$10$yd53Z0ydlKB9/DaDw/jHFO8eWLtgbWsNjjYH9eSY1dvKPRBkC2B3a}"
        roles: [PARTNER]
        # Must match the partner resource id to scope shows/accounts; empty disables ownership checks for this user.
        owner-id: ${TICKETHUB_PARTNER_OWNER_ID:}
      - username: ${TICKETHUB_CUSTOMER_USERNAME:customer}
        password: "${TICKETHUB_CUSTOMER_PASSWORD_HASH:$2a$10$8oOcWuB1hV9DFQk73vuOr.4NE22eOqPObY/YeQBli2zYPuo4he2d2}"
        roles: [CUSTOMER]
        # Must match the customer resource id for self-service; empty disables ownership checks for this user.
        owner-id: ${TICKETHUB_CUSTOMER_OWNER_ID:}
  mongo:
    connect-timeout: ${MONGO_CONNECT_TIMEOUT:5s}
    read-timeout: ${MONGO_READ_TIMEOUT:5s}
    server-selection-timeout: ${MONGO_SERVER_SELECTION_TIMEOUT:5s}
  kafka:
    topic:
      name: ${KAFKA_TOPIC:tickethub.events}
      partitions: ${KAFKA_TOPIC_PARTITIONS:3}
      replicas: ${KAFKA_TOPIC_REPLICAS:1}
  resilience:
    retry:
      max-attempts: ${RESILIENCE_RETRY_MAX_ATTEMPTS:3}
      wait-ms: ${RESILIENCE_RETRY_WAIT_MS:200}
    circuit-breaker:
      failure-rate-threshold: ${RESILIENCE_CB_FAILURE_RATE:50}
      wait-duration-ms: ${RESILIENCE_CB_WAIT_MS:10000}
      sliding-window-size: ${RESILIENCE_CB_WINDOW:20}
      minimum-calls: ${RESILIENCE_CB_MIN_CALLS:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        # Metrics go through Prometheus exposition + Alloy scrape; keep OTLP push off.
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [${spring.application.name},%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
