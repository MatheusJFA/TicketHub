[tools]
java = "25.0.2"
maven = "3.9.16"

[tasks.application]
description = "Build and run the Spring Boot application (skip tests)"
run = [
  "mvn -B -ntp -pl infrastructure -am package -DskipTests",
  "java -jar infrastructure/target/infrastructure-0.0.1-SNAPSHOT.jar",
]

[tasks.compile]
description = "Compile every module without running tests"
run = "mvn -B -ntp compile"

[tasks.compile-watch]
description = "Recompile automatically on file changes (requires watchexec)"
run = "mise watch compile"

[tasks.test]
description = "Run tests in every module, including architecture tests"
run = "mvn -B -ntp test"

[tasks.lint-spotless]
description = "Format the whole project to palantir"
run = "mvn -B -ntp spotless:apply"

[tasks.lint-verify]
description = "Check if the format in the whole project is ok"
run = "mvn -B -ntp spotless:verify"

[tasks.test-only]
description = "Run specific unit tests: mise run test-only 'CustomerTest,SpotTest'"
usage = 'arg "<filter>" help="Test filter for Maven -Dtest (ex: CustomerTest or CustomerTest#myMethod)"'
run = 'mvn -B -ntp -Dtest="${usage_filter?}" -Dsurefire.failIfNoSpecifiedTests=false test'

[tasks.it-only]
description = "Run specific integration tests: mise run it-only 'SpotE2ETest' (requires Docker)"
usage = 'arg "<filter>" help="Test filter for Maven -Dit.test (ex: SpotE2ETest)"'
run = 'mvn -B -ntp -Pintegration -Dtest="!*" -Dsurefire.failIfNoSpecifiedTests=false -Dit.test="${usage_filter?}" -DfailIfNoTests=false verify'

[tasks.build]
description = "Build every module and run all verification checks"
alias = "verify"
run = "mvn -B -ntp verify"

[tasks.integration]
description = "Verify all modules and test real MongoDB and Kafka via Testcontainers (requires Docker)"
run = "mvn -B -ntp -Pintegration verify"

[tasks.install]
description = "Verify and install every module in the local Maven repository"
run = "mvn -B -ntp install"

[tasks.clean]
description = "Remove module build outputs, preserving root recovery backups"
run = "mvn -B -ntp -pl domain,application,infrastructure clean"

[tasks.versions]
description = "Show the Java and Maven versions used by mise"
run = "mvn --version"
