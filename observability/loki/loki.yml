auth_enabled: false

# Tolerate Alloy restarts/backfill: loki.source.docker replays container
# logs from the Docker daemon, and the default ~1h acceptance window made
# Loki reject ("entry too far behind") everything older, spamming the Alloy
# log and losing history. 168h keeps dev restarts lossless.
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
