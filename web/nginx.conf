server {
    listen 80;

    # Runtime config: always fresh, never immutable-cached.
    location = /app-config.json {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Static assets: fail fast instead of falling back to index.html,
    # so a missing bundle is a visible 404 instead of a broken page.
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?|json)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
