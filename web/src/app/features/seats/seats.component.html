<section>
  <h1 class="mb-4 text-2xl font-bold">Assentos</h1>
  <form class="mb-4 flex gap-2" (ngSubmit)="load()">
    <input
      name="search"
      [(ngModel)]="search"
      placeholder="Buscar por localização (ex.: A1)"
      class="flex-1 rounded-md border border-slate-700 bg-[#171b22] px-3 py-2 text-slate-100" />
    <button type="submit" class="rounded-md bg-blue-600 px-4 py-2 font-medium text-white">Buscar</button>
  </form>
  @if (loading()) {
    <p class="text-slate-400">Carregando…</p>
  } @else if (error()) {
    <p class="text-sm text-red-400">{{ error() }}</p>
  } @else {
    <div class="mb-4 grid grid-cols-[repeat(auto-fill,minmax(64px,1fr))] gap-2">
      @for (spot of spots(); track spot.id) {
        <button
          type="button"
          (click)="toggle(spot)"
          [disabled]="!spot.available"
          [title]="spot.location"
          [class.bg-blue-600]="cart.contains(spot.id)"
          [class.border-blue-600]="cart.contains(spot.id)"
          class="rounded-md border border-slate-700 bg-[#171b22] py-2 text-sm text-slate-100 disabled:border-slate-800 disabled:bg-transparent disabled:text-slate-500">
          {{ spot.location }}
        </button>
      }
    </div>
    <div class="flex items-center justify-between gap-4">
      <span class="text-slate-400">{{ cart.spots().length }} selecionado(s)</span>
      <button
        type="button"
        (click)="checkout()"
        [disabled]="cart.spots().length === 0"
        class="rounded-md bg-blue-600 px-4 py-2 font-medium text-white disabled:opacity-50">
        Ir para o checkout
      </button>
    </div>
    <p class="mt-3 text-sm text-slate-400"><a routerLink="/" class="text-sky-400">Voltar aos shows</a></p>
  }
</section>
