<section class="mx-auto max-w-md">
  <div class="th-ticket overflow-hidden">
    <div class="border-b-2 border-[#2a241a] bg-[#2a241a] p-6 text-[#fdf8ec]">
      <div class="flex items-center justify-between">
        <p class="th-display text-2xl">{{ i18n.t('ticket.boxOffice') }}</p>
        <span class="grid h-9 w-11 place-items-center rounded border-2 border-[#f6ecd4] bg-[#f6ecd4]"><img src="ticket.svg" alt="TicketHub" class="h-6 w-6" /></span>
      </div>
      <h1 class="th-display mt-2 text-3xl">{{ i18n.t('auth.loginTitle') }}</h1>
      <p class="mt-1 text-sm text-[#c9bfa9]">{{ i18n.t('auth.loginSub') }}</p>
    </div>
    <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4 p-6" novalidate>
      <label class="th-label">
        {{ i18n.t('auth.identifier') }}
        <input
          formControlName="identifier"
          required
          autocomplete="username"
          [attr.aria-invalid]="form.controls.identifier.invalid && form.controls.identifier.touched"
          aria-describedby="login-identifier-err"
          [placeholder]="i18n.t('auth.identifierPh')"
          class="th-input" />
        @if (form.controls.identifier.touched && form.controls.identifier.invalid) {
          <span id="login-identifier-err" class="text-xs font-bold text-[#c93a2e]">{{ i18n.t('errors.requiredField') }}</span>
        }
      </label>
      <label class="th-label">
        {{ i18n.t('auth.password') }}
        <div class="relative">
          <input
            formControlName="password"
            [type]="showPassword() ? 'text' : 'password'"
            required
            minlength="6"
            autocomplete="current-password"
            [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
            aria-describedby="login-password-err"
            placeholder="••••••••"
            class="th-input pr-12" />
          <button type="button" (click)="showPassword.set(!showPassword())" class="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-bold text-[#6f6353] underline" [attr.aria-pressed]="showPassword()">
            {{ showPassword() ? '🙈' : '👁' }}
          </button>
        </div>
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span id="login-password-err" class="text-xs font-bold text-[#c93a2e]">{{ i18n.t('errors.minLength', { min: 6 }) }}</span>
        }
      </label>
      @if (error()) {
        <div class="th-alert-error" role="alert">{{ error() }}</div>
      }
      <button type="submit" [disabled]="form.invalid || loading()" class="th-btn-stamp w-full disabled:cursor-not-allowed disabled:opacity-50">
        {{ loading() ? i18n.t('auth.loggingIn') : i18n.t('auth.loginBtn') }}
      </button>
      <div class="th-perfo-x"></div>
      <p class="text-center text-sm text-[#6f6353]">{{ i18n.t('auth.noAccount') }} <a routerLink="/signup" class="th-link">{{ i18n.t('auth.signupFree') }}</a></p>
    </form>
  </div>
</section>
