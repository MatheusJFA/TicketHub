<section class="max-w-md">
  <h1 class="mb-1 text-2xl font-bold">Entrar</h1>
  <p class="mb-4 text-sm text-slate-400">
    Use seu e-mail de cliente. Contas de demonstração estão no README do servidor.
  </p>
  <form (ngSubmit)="submit()" class="grid gap-3">
    <label class="grid gap-1 text-sm">
      E-mail ou usuário
      <input
        name="identifier"
        [(ngModel)]="identifier"
        required
        autocomplete="username"
        class="rounded-md border border-slate-700 bg-[#171b22] px-3 py-2 text-slate-100" />
    </label>
    <label class="grid gap-1 text-sm">
      Senha
      <input
        name="password"
        [(ngModel)]="password"
        type="password"
        required
        autocomplete="current-password"
        class="rounded-md border border-slate-700 bg-[#171b22] px-3 py-2 text-slate-100" />
    </label>
    @if (error()) {
      <p class="text-sm text-red-400">{{ error() }}</p>
    }
    <button
      type="submit"
      [disabled]="loading()"
      class="rounded-md bg-blue-600 px-4 py-2 font-medium text-white disabled:opacity-50">
      {{ loading() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
  <p class="mt-3 text-sm text-slate-400">Sem conta? <a routerLink="/signup" class="text-sky-400">Cadastre-se</a></p>
</section>
