<section class="max-w-md">
  <h1 class="mb-4 text-2xl font-bold">Criar conta</h1>
  <form (ngSubmit)="submit()" class="grid gap-3">
    <label class="grid gap-1 text-sm">
      CPF
      <input
        name="cpf"
        [(ngModel)]="cpf"
        required
        inputmode="numeric"
        class="rounded-md border border-slate-700 bg-[#171b22] px-3 py-2 text-slate-100" />
    </label>
    <label class="grid gap-1 text-sm">
      Nome
      <input
        name="name"
        [(ngModel)]="name"
        required
        autocomplete="name"
        class="rounded-md border border-slate-700 bg-[#171b22] px-3 py-2 text-slate-100" />
    </label>
    <label class="grid gap-1 text-sm">
      E-mail
      <input
        name="email"
        [(ngModel)]="email"
        type="email"
        required
        autocomplete="email"
        class="rounded-md border border-slate-700 bg-[#171b22] px-3 py-2 text-slate-100" />
    </label>
    <label class="grid gap-1 text-sm">
      Senha
      <input
        name="password"
        [(ngModel)]="password"
        type="password"
        required
        autocomplete="new-password"
        class="rounded-md border border-slate-700 bg-[#171b22] px-3 py-2 text-slate-100" />
    </label>
    @if (error()) {
      <p class="text-sm text-red-400">{{ error() }}</p>
    }
    <button
      type="submit"
      [disabled]="loading()"
      class="rounded-md bg-blue-600 px-4 py-2 font-medium text-white disabled:opacity-50">
      {{ loading() ? 'Cadastrando…' : 'Cadastrar' }}
    </button>
  </form>
  <p class="mt-3 text-sm text-slate-400">Já tem conta? <a routerLink="/login" class="text-sky-400">Entrar</a></p>
</section>
