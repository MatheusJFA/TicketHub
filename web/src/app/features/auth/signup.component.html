<section class="mx-auto max-w-md">
  <div class="th-ticket overflow-hidden">
    <div class="border-b-2 border-[#2a241a] bg-[#2a241a] p-6 text-[#fff8ee]">
      <div class="flex items-center justify-between">
        <p class="th-display text-2xl">{{ i18n.t('ticket.boxOffice') }}</p>
        <span class="grid h-9 w-11 place-items-center rounded border-2 border-[#2a241a] bg-[#2a241a]"><img src="ticket.svg" alt="TicketHub" class="h-6 w-6" /></span>
      </div>
      <h1 class="th-display mt-2 text-3xl">{{ i18n.t('auth.signupTitle') }}</h1>
      <p class="mt-1 text-sm text-[#ffe9d6]">{{ i18n.t('auth.signupSub') }}</p>
    </div>
    <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4 p-6" novalidate>
      <label class="th-label">
        {{ i18n.t('auth.cpf') }}
        <input formControlName="cpf" required inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" class="th-input" [attr.aria-invalid]="form.controls.cpf.invalid && form.controls.cpf.touched" />
        @if (form.controls.cpf.touched && form.controls.cpf.invalid) {
          <span class="text-xs font-bold text-[#c93a2e]">{{ i18n.t('errors.invalidCpf') }}</span>
        }
      </label>
      <label class="th-label">
        {{ i18n.t('auth.name') }}
        <input formControlName="name" required autocomplete="name" [placeholder]="i18n.t('auth.namePh')" class="th-input" [attr.aria-invalid]="form.controls.name.invalid && form.controls.name.touched" />
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <span class="text-xs font-bold text-[#c93a2e]">{{ i18n.t('errors.requiredField') }}</span>
        }
      </label>
      <label class="th-label">
        {{ i18n.t('auth.email') }}
        <input formControlName="email" type="email" required autocomplete="email" [placeholder]="i18n.t('auth.identifierPh')" class="th-input" [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="text-xs font-bold text-[#c93a2e]">{{ i18n.t('errors.invalidEmail') }}</span>
        }
      </label>
      <label class="th-label">
        {{ i18n.t('auth.password') }}
        <div class="relative">
          <input formControlName="password" [type]="showPassword() ? 'text' : 'password'" required minlength="8" autocomplete="new-password" [placeholder]="i18n.t('auth.passwordMin')" class="th-input pr-12" [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched" />
          <button type="button" (click)="showPassword.set(!showPassword())" class="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-bold text-[#6f6353] underline" [attr.aria-pressed]="showPassword()">👁</button>
        </div>
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="text-xs font-bold text-[#c93a2e]">{{ i18n.t('errors.minLength', { min: 8 }) }}</span>
        }
      </label>
      @if (error()) {
        <div class="th-alert-error" role="alert">{{ error() }}</div>
      }
      <button type="submit" [disabled]="form.invalid || loading()" class="th-btn-stamp w-full disabled:cursor-not-allowed disabled:opacity-50">
        {{ loading() ? i18n.t('auth.signingUp') : i18n.t('auth.signupBtn') }}
      </button>
      <div class="th-perfo-x"></div>
      <p class="text-center text-sm text-[#6f6353]">{{ i18n.t('auth.hasAccount') }} <a routerLink="/login" class="th-link">{{ i18n.t('auth.loginTitle') }}</a></p>
    </form>
  </div>
</section>
