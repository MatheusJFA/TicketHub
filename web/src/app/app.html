<header class="flex items-center justify-between border-b border-slate-800 bg-[#171b22] px-6 py-3">
  <a routerLink="/" class="text-xl font-bold text-slate-100">TicketHub</a>
  <nav class="flex items-center gap-4 text-slate-400">
    <a routerLink="/" class="hover:text-slate-100">Shows</a>
    <a routerLink="/seats" class="hover:text-slate-100"
      >Assentos @if (cart.spots().length > 0) {
        ({{ cart.spots().length }})
      }</a
    >
    <a routerLink="/orders" class="hover:text-slate-100">Meu pedido</a>
    @if (auth.canManageCatalog) {
      <a routerLink="/admin" class="hover:text-slate-100">Admin</a>
    }
    @if (auth.isLoggedIn()) {
      <button type="button" (click)="logout()" class="hover:text-slate-100">Sair</button>
    } @else {
      <a routerLink="/login" class="hover:text-slate-100">Entrar</a>
    }
  </nav>
</header>
<main class="mx-auto max-w-4xl px-6 py-6">
  <router-outlet />
</main>
